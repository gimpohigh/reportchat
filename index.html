<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김포고 수강신청 - 관리자 1:1 채팅</title>
    <!-- 🔥 Firebase App, Database (Storage 완전 제거 -> ImgBB 사용) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        :root {
            --primary-dark: #2A52BE; 
            --primary-light: #678CEB; 
            --bg-color: #F2F4F6;
            --text-black: #191F28;
            --text-gray: #8B95A1; 
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Pretendard', -apple-system, sans-serif; background-color: var(--bg-color); display: flex; }
        
        /* 왼쪽 채팅방 목록 패널 */
        .chat-list-panel { width: 320px; background-color: white; border-right: 1px solid #E5E8EB; display: flex; flex-direction: column; flex-shrink: 0; }
        .panel-header { padding: 20px; background-color: var(--primary-dark); color: white; font-weight: bold; font-size: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
        .user-list { flex: 1; overflow-y: auto; }
        
        .user-item { padding: 16px; border-bottom: 1px solid #F2F4F6; cursor: pointer; transition: background 0.2s; }
        .user-item:hover, .user-item.active { background-color: #E8F0FE; }
        .user-name { font-weight: bold; font-size: 14px; color: var(--text-black); margin-bottom: 6px; }
        .user-preview { font-size: 12px; color: var(--text-gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 오른쪽 채팅 화면 패널 */
        .chat-room-panel { flex: 1; display: flex; flex-direction: column; background-color: #B2C7E7; position: relative; min-width: 0; }
        .room-header { padding: 20px; background-color: white; border-bottom: 1px solid #E5E8EB; font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; width: 100%; box-sizing: border-box; }
        
        /* 🔥 삭제 버튼 디자인 */
        .delete-room-btn { background-color: #FF5252; color: white; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .delete-room-btn:hover { background-color: #E53935; }

        .room-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        
        /* 🔥 날짜 구분선 디자인 */
        .date-separator {
            align-self: center; background-color: rgba(0, 0, 0, 0.15); color: #FFFFFF; font-size: 12px;
            font-weight: bold; padding: 6px 16px; border-radius: 20px; margin: 16px 0; display: flex; align-items: center; gap: 6px;
        }
        .date-separator svg { width: 12px; height: 12px; fill: currentColor; }

        .msg-container { display: flex; flex-direction: column; max-width: 70%; }
        .msg-admin-container { align-self: flex-end; align-items: flex-end; }
        .msg-user-container { align-self: flex-start; align-items: flex-start; }
        
        .msg-sender { font-size: 11px; color: #4E5968; margin-bottom: 4px; padding: 0 4px; font-weight: bold; }
        
        /* 🔥 말풍선과 시간 가로 정렬 */
        .msg-row-admin { display: flex; flex-direction: row; align-items: flex-end; justify-content: flex-end; gap: 6px; }
        .msg-row-user { display: flex; flex-direction: row; align-items: flex-end; justify-content: flex-start; gap: 6px; }
        
        .msg-bubble { padding: 10px 14px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        
        .msg-admin { background-color: var(--primary-dark); color: white; border-radius: 14px; border-top-right-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .msg-user { background-color: white; color: #191F28; border-radius: 14px; border-top-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }

        /* 🔥 시간 텍스트 디자인 */
        .msg-time { font-size: 10px; color: #6B7684; flex-shrink: 0; margin-bottom: 2px; }
        
        /* 🔥 채팅방 전송된 이미지 디자인 (말풍선 없이) */
        .chat-image-wrap { display: flex; flex-direction: column; gap: 4px; max-width: 250px; margin-top: 4px; }
        .chat-image { width: 100%; border-radius: 12px; cursor: pointer; border: 1px solid rgba(0,0,0,0.1); object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .img-download-btn { font-size: 10px; color: var(--primary-dark); cursor: pointer; background: white; border: 1px solid #D1D6DB; padding: 6px; border-radius: 6px; font-weight: bold; text-align: center; text-decoration: none; }
        .img-download-btn:active { background: #F2F4F6; }
        .img-list { display: flex; flex-direction: column; gap: 8px; }

        /* 🔥 입력 영역 (미리보기 + 인풋) */
        .room-input-container { background-color: white; border-top: 1px solid #E5E8EB; display: flex; flex-direction: column; flex-shrink: 0; }
        
        .preview-area { display: flex; gap: 10px; padding: 12px 16px 0 16px; overflow-x: auto; }
        .preview-img-wrap { position: relative; width: 64px; height: 64px; flex-shrink: 0; border: 1px solid #E5E8EB; border-radius: 8px; }
        .preview-img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
        .preview-del { position: absolute; top: -6px; right: -6px; background: rgba(0,0,0,0.6); color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; font-weight: bold; }
        
        .room-input-area { padding: 12px 16px; display: flex; gap: 10px; align-items: center; }
        .attach-btn { background-color: #F2F4F6; border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; color: #4E5968; transition: 0.2s; flex-shrink: 0; }
        .attach-btn:hover { background-color: #E5E8EB; }
        .room-input { flex: 1; padding: 12px 16px; border: 1px solid #D1D6DB; border-radius: 24px; outline: none; font-size: 14px; background-color: var(--bg-color); min-width: 0; }
        .room-send-btn { padding: 0 24px; height: 44px; background-color: var(--primary-dark); color: white; border: none; border-radius: 24px; font-weight: bold; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
        .room-send-btn:active { background-color: var(--primary-light); }
        .room-send-btn:disabled { background-color: #D1D6DB; cursor: not-allowed; }
        
        .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: #6B7684; font-size: 15px; font-weight: bold; background-color: #B2C7E7; }

    </style>
</head>
<body>

    <!-- 왼쪽 사용자 리스트 -->
    <div class="chat-list-panel">
        <div class="panel-header">
            <span>학생 문의 관리</span>
        </div>
        <div class="user-list" id="userList">
            <!-- 자바스크립트로 렌더링 -->
        </div>
    </div>

    <!-- 오른쪽 채팅 내역 -->
    <div class="chat-room-panel">
        <div id="roomEmpty" class="empty-state">왼쪽에서 대화방을 선택해주세요.</div>
        
        <div id="roomActive" style="display: none; height: 100%; flex-direction: column;">
            <div class="room-header">
                <span id="roomTitle">사용자 이름</span>
                <button id="deleteRoomBtn" class="delete-room-btn" style="display: none;" onclick="deleteCurrentRoom()">대화방 삭제</button>
            </div>
            <div class="room-messages" id="roomMessages">
                <!-- 메시지 렌더링 -->
            </div>
            
            <div class="room-input-container">
                <!-- 이미지 미리보기 영역 -->
                <div id="previewArea" class="preview-area" style="display: none;"></div>
                
                <div class="room-input-area">
                    <label for="imgUpload" class="attach-btn" title="이미지 첨부">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </label>
                    <input type="file" id="imgUpload" multiple accept="image/*" style="display:none;" onchange="handleFileSelect(event)">
                    
                    <input type="text" id="adminInput" class="room-input" placeholder="답변을 입력하세요">
                    <button class="room-send-btn" id="sendBtn" onclick="sendReply()">전송</button>
                </div>
            </div>
        </div>
    </div>

<script>
    // 🔥 메인 앱과 완벽히 동일한 Firebase 정보 세팅 (Storage 완전 제거)
    const firebaseConfig = {
      apiKey: "AIzaSyD-IyAGGXQ69d8LupTU2mKmr87yoenahRo",
      authDomain: "gimpo-monitoring.firebaseapp.com",
      databaseURL: "https://gimpo-monitoring-default-rtdb.firebaseio.com",
      projectId: "gimpo-monitoring",
      messagingSenderId: "918422830852",
      appId: "1:918422830852:web:c9d6412cb2fc3dcc619a51",
      measurementId: "G-292HR1LYHY"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 🔴 메인 사이트에 넣은 것과 똑같은 32자리 ImgBB API 키를 쌍따옴표 안에 붙여넣으세요!
    const IMGBB_API_KEY = "여기에_발급받은_API_키_붙여넣기";

    let usersData = {}; 
    let currentChatUid = null;
    let currentListener = null;
    let currentChatName = ""; 
    let lastMessageDateStr = ""; 
    
    let selectedFiles = []; 

    // 1. 유저 데이터 감지 및 가공 (1학년 N반 N번 OOO 형태로 완벽 가공)
    database.ref('user_data').on('value', snap => {
        const data = snap.val();
        if(!data) return;
        for(let uid in data) {
            const u = data[uid];
            // 반 번호가 모두 있는 경우
            if(u.classNum && u.studentNum && u.name) {
                usersData[uid] = `1학년 ${u.classNum}반 ${u.studentNum}번 ${u.name}`;
            } 
            // 이름만 있는 경우의 대비책
            else if(u.name) {
                usersData[uid] = u.name;
            }
        }
        renderUserList();
    });

    // 2. 전체 문의방 목록 감지
    let allInquiries = {};
    database.ref('inquiries').on('value', snap => {
        allInquiries = snap.val() || {};
        renderUserList();
    });

    function renderUserList() {
        const listDiv = document.getElementById('userList');
        listDiv.innerHTML = '';
        
        let rooms = [];
        for(let uid in allInquiries) {
            const msgsObj = allInquiries[uid];
            const msgsArr = Object.values(msgsObj);
            const lastMsg = msgsArr[msgsArr.length - 1];
            rooms.push({ uid, lastMsg });
        }
        rooms.sort((a, b) => (b.lastMsg.timestamp || 0) - (a.lastMsg.timestamp || 0));

        rooms.forEach(room => {
            const uid = room.uid;
            const lastMsg = room.lastMsg;
            
            let nickname = "알 수 없는 사용자";
            // 💡 이름 판단 로직 (우선순위 적용)
            if (usersData[uid]) {
                nickname = usersData[uid]; // 로그인 유저 (1학년 ~)
            } else if (lastMsg && lastMsg.senderName) {
                nickname = lastMsg.senderName; // 익명 유저 (입력한 이름 그대로 출력, '익명 - ' 없음)
            }

            let previewText = lastMsg.text || '';
            if(!previewText && lastMsg.images) previewText = "(사진 전송)";

            const item = document.createElement('div');
            item.className = `user-item ${currentChatUid === uid ? 'active' : ''}`;
            item.onclick = () => openChat(uid, nickname);
            
            item.innerHTML = `
                <div class="user-name">${nickname}</div>
                <div class="user-preview">${previewText}</div>
            `;
            listDiv.appendChild(item);
        });
    }

    // 날짜 형식 변환
    function formatDate(ts) {
        if(!ts) return '';
        const d = new Date(ts);
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
    }

    // 시간 형식 변환
    function formatTime(ts) {
        if(!ts) return '';
        const d = new Date(ts);
        const h = String(d.getHours()).padStart(2, '0');
        const m = String(d.getMinutes()).padStart(2, '0');
        return `${h}:${m}`;
    }

    // 채팅방 삭제 기능
    window.deleteCurrentRoom = function() {
        if(!currentChatUid) return;
        if(confirm("정말 이 학생과의 대화방(모든 메시지 및 사진 기록)을 삭제하시겠습니까?\n삭제된 데이터는 절대 복구할 수 없습니다.")) {
            database.ref('inquiries/' + currentChatUid).remove().then(() => {
                alert("대화방이 삭제되었습니다.");
                document.getElementById('roomActive').style.display = 'none';
                document.getElementById('roomEmpty').style.display = 'flex';
                document.getElementById('deleteRoomBtn').style.display = 'none';
                currentChatUid = null;
                currentChatName = "";
            }).catch(err => {
                console.error("삭제 실패:", err);
                alert("삭제 중 오류가 발생했습니다.");
            });
        }
    }

    function openChat(uid, nickname) {
        currentChatUid = uid;
        currentChatName = nickname;
        renderUserList(); 
        
        document.getElementById('roomEmpty').style.display = 'none';
        document.getElementById('roomActive').style.display = 'flex';
        document.getElementById('roomTitle').innerText = `${nickname} 님과의 대화`;
        document.getElementById('deleteRoomBtn').style.display = 'block'; // 삭제 버튼 활성화
        
        const msgDiv = document.getElementById('roomMessages');
        msgDiv.innerHTML = '';
        lastMessageDateStr = "";

        if(currentListener) database.ref('inquiries/' + currentListener).off();
        currentListener = uid;

        // 채팅 렌더링
        database.ref('inquiries/' + uid).on('child_added', snap => {
            const msg = snap.val();
            if (!msg.timestamp) msg.timestamp = Date.now(); 

            const msgDate = formatDate(msg.timestamp);
            if (msgDate && msgDate !== lastMessageDateStr) {
                msgDiv.innerHTML += `
                    <div class="date-separator">
                        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="2"/><line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="2"/><line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2"/></svg>
                        ${msgDate}
                    </div>
                `;
                lastMessageDateStr = msgDate;
            }

            const isAdmin = msg.role === 'admin';
            const displaySender = isAdmin ? '개발자' : currentChatName;
            const timeStr = formatTime(msg.timestamp);
            
            let imgHtml = '';
            if (msg.images && msg.images.length > 0) {
                const imgTags = msg.images.map(url => `
                    <div class="chat-image-wrap">
                        <img src="${url}" class="chat-image" onclick="window.open('${url}')">
                        <a href="${url}" target="_blank" download class="img-download-btn">⬇ 원본 다운로드</a>
                    </div>
                `).join('');
                imgHtml = `<div class="img-list">${imgTags}</div>`;
            }

            let textHtml = '';
            if (msg.text) {
                const bubbleClass = isAdmin ? 'msg-admin' : 'msg-user';
                textHtml = `<div class="msg-bubble ${bubbleClass}">${msg.text.replace(/\n/g, '<br>')}</div>`;
            }

            const containerClass = isAdmin ? 'msg-admin-container' : 'msg-user-container';
            const rowClass = isAdmin ? 'msg-row-admin' : 'msg-row-user';
            
            let finalHtml = '';
            if (textHtml || imgHtml) {
                if (isAdmin) {
                    finalHtml = `
                        <div class="${rowClass}">
                            <div class="msg-time">${timeStr}</div>
                            <div style="display:flex; flex-direction:column; align-items:flex-end;">
                                ${textHtml}
                                ${imgHtml}
                            </div>
                        </div>
                    `;
                } else {
                    finalHtml = `
                        <div class="${rowClass}">
                            <div style="display:flex; flex-direction:column; align-items:flex-start;">
                                ${textHtml}
                                ${imgHtml}
                            </div>
                            <div class="msg-time">${timeStr}</div>
                        </div>
                    `;
                }
            }

            msgDiv.innerHTML += `
                <div class="msg-container ${containerClass}">
                    ${isAdmin ? '' : `<div class="msg-sender">${displaySender}</div>`}
                    ${finalHtml}
                </div>
            `;
            msgDiv.scrollTop = msgDiv.scrollHeight;
        });
    }

    // 🔥 이미지 파일 선택 및 미리보기 렌더링 로직 (벡터 X 아이콘 적용)
    window.handleFileSelect = function(e) {
        const files = Array.from(e.target.files);
        if(files.length === 0) return;
        selectedFiles = selectedFiles.concat(files);
        renderPreview();
        e.target.value = ''; 
    }

    window.removeFile = function(index) {
        selectedFiles.splice(index, 1);
        renderPreview();
    }

    function renderPreview() {
        const area = document.getElementById('previewArea');
        if (selectedFiles.length === 0) {
            area.style.display = 'none';
            area.innerHTML = '';
            return;
        }
        
        area.style.display = 'flex';
        area.innerHTML = selectedFiles.map((file, idx) => `
            <div class="preview-img-wrap">
                <img src="${URL.createObjectURL(file)}" class="preview-img">
                <div class="preview-del" onclick="removeFile(${idx})">
                    <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </div>
            </div>
        `).join('');
    }

    let isSending = false; 

    // 🔥 답변 전송 (파이어베이스 Storage 제거 -> 무료 ImgBB API로 고화질 전송)
    async function sendReply() {
        if(!currentChatUid || isSending) return;
        
        const input = document.getElementById('adminInput');
        const btn = document.getElementById('sendBtn');
        const text = input.value.trim();
        
        if(!text && selectedFiles.length === 0) return; 

        // API 키 입력 확인용 안전장치
        if(selectedFiles.length > 0 && IMGBB_API_KEY === "aa1fa62c3d6c1259d4b83394320ce47c") {
            alert("개발자 설정 오류: ImgBB API 키가 입력되지 않았습니다.");
            return;
        }
        
        isSending = true;
        btn.innerText = "⏳";
        btn.disabled = true;

        try {
            let imageUrls = [];
            // 선택된 이미지가 있다면 ImgBB 서버로 업로드하여 고화질 원본 링크를 받아옴
            if (selectedFiles.length > 0) {
                for(let file of selectedFiles) {
                    const formData = new FormData();
                    formData.append("image", file);

                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: "POST",
                        body: formData
                    });
                    const data = await res.json();
                    
                    if(data.success) {
                        imageUrls.push(data.data.url); // ImgBB에서 받은 이미지 URL 저장
                    } else {
                        throw new Error("ImgBB Upload Failed");
                    }
                }
            }

            const payload = {
                role: 'admin',
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };
            if(text) payload.text = text;
            if(imageUrls.length > 0) payload.images = imageUrls;

            // 파이어베이스 데이터베이스에는 텍스트와 사진 링크(URL)만 저장함
            await database.ref('inquiries/' + currentChatUid).push(payload);
            
            input.value = '';
            selectedFiles = [];
            renderPreview();

        } catch (error) {
            console.error("전송 실패:", error);
            alert("메시지 또는 이미지 전송에 실패했습니다. API 키나 인터넷 연결을 확인해주세요.");
        } finally {
            btn.innerText = "전송";
            btn.disabled = false;
            isSending = false;
            document.getElementById('adminInput').focus();
        }
    }

    document.getElementById('adminInput').addEventListener('keydown', function(e) {
        if(e.key === 'Enter') { 
            e.preventDefault(); 
            sendReply(); 
        }
    });

</script>
</body>
</html>
